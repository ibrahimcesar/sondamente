[package]
name = "sondamente"
version = "0.0.1"
edition = "2021"
description = "Preregistered probes for philosophy-of-mind claims about LLMs: every probe states what rival hypotheses predict."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "evaluation", "philosophy", "preregistration", "probes"]
categories = ["science", "command-line-utilities"]
repository = "https://github.com/ibrahimcesar/sondamente"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
